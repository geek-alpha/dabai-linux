<body>

            <button class="pv-btn" id="next-btn" title="下一个">⏭</button>

                        <div class="num" id="stat-total">—</div>

                    </div>
                    <div class="stat-card">

                    </div>

                </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

        // ==================== 日志 ====================
        const logPanel = document.getElementById('log-panel');
        function log(msg, type = '') {
            const line = document.createElement('div');
            line.className = 'log-line ' + type;
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            line.textContent = `[${time}] ${msg}`;
            logPanel.appendChild(line);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        // ==================== Three.js 场景 ====================
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
        camera.position.set(0, 1.3, 2.5);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;

        function resize() {
            const w = canvas.parentElement.clientWidth;
            const h = canvas.parentElement.clientHeight;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => setTimeout(resize, 300));
        resize();

        // 灯光
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444466, 0.8);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(3, 5, 3);
        scene.add(dirLight);
        const rimLight = new THREE.DirectionalLight(0x8888ff, 0.4);
        rimLight.position.set(-3, 2, -3);
        scene.add(rimLight);

        // 地面
        const grid = new THREE.GridHelper(10, 20, 0x444466, 0x222244);
        scene.add(grid);

        // 控制器（触摸友好）
        const controls = new OrbitControls(camera, canvas);
        controls.target.set(0, 1.2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enablePan = false;
        controls.minDistance = 1.2;
        controls.maxDistance = 6;
        controls.maxPolarAngle = Math.PI * 0.92;

        // ==================== VRM ====================
        let currentVRM = null;
        let mixer = null;
        let currentAction = null;

        function setStatus(text, state = '') {
            document.getElementById('status-text').textContent = text;
            const dot = document.getElementById('status-dot');
            dot.className = 'dot ' + state;
        }

        async function loadVRM(url) {
            setStatus('加载模型中…');
            log('开始加载模型: ' + url, 'info');
            try {
                const loader = new GLTFLoader();
                loader.register((parser) => new VRMLoaderPlugin(parser));
                const gltf = await loader.loadAsync(url);
                const vrm = gltf.userData.vrm;

                VRMUtils.rotateVRM0(vrm);

                // 缩放适配
                const box = new THREE.Box3().setFromObject(vrm.scene);
                const height = box.max.y - box.min.y;
                const scale = 1.6 / height;
                vrm.scene.scale.setScalar(scale);

                scene.add(vrm.scene);
                currentVRM = vrm;

                mixer = new THREE.AnimationMixer(vrm.scene);

                // 更新相机目标
                controls.target.set(0, 1.0, 0);
                controls.update();

                setStatus('模型已就绪', 'ready');
                log('模型加载成功', 'success');

                // 启用动作库按钮
                document.getElementById('load-lib-btn').disabled = false;
                document.getElementById('load-lazy-btn').disabled = false;

                return vrm;
            } catch (e) {
                setStatus('模型加载失败', 'error');
                log('模型加载失败: ' + e.message, 'error');
                throw e;
            }
        }

        // ==================== Mixamo 重定向核心（从项目代码移植） ====================
        const mixamoVRMRigMap = {
            mixamorigHips: 'hips', mixamorigSpine: 'spine', mixamorigSpine1: 'chest',
            mixamorigSpine2: 'upperChest', mixamorigNeck: 'neck', mixamorigHead: 'head',
            mixamorigLeftShoulder: 'leftShoulder', mixamorigLeftArm: 'leftUpperArm',
            mixamorigLeftForeArm: 'leftLowerArm', mixamorigLeftHand: 'leftHand',
            mixamorigLeftHandThumb1: 'leftThumbMetacarpal', mixamorigLeftHandThumb2: 'leftThumbProximal',
            mixamorigLeftHandThumb3: 'leftThumbDistal', mixamorigLeftHandIndex1: 'leftIndexProximal',
            mixamorigLeftHandIndex2: 'leftIndexIntermediate', mixamorigLeftHandIndex3: 'leftIndexDistal',
            mixamorigLeftHandMiddle1: 'leftMiddleProximal', mixamorigLeftHandMiddle2: 'leftMiddleIntermediate',
            mixamorigLeftHandMiddle3: 'leftMiddleDistal', mixamorigLeftHandRing1: 'leftRingProximal',
            mixamorigLeftHandRing2: 'leftRingIntermediate', mixamorigLeftHandRing3: 'leftRingDistal',
            mixamorigLeftHandPinky1: 'leftLittleProximal', mixamorigLeftHandPinky2: 'leftLittleIntermediate',
            mixamorigLeftHandPinky3: 'leftLittleDistal',
            mixamorigRightShoulder: 'rightShoulder', mixamorigRightArm: 'rightUpperArm',
            mixamorigRightForeArm: 'rightLowerArm', mixamorigRightHand: 'rightHand',
            mixamorigRightHandThumb1: 'rightThumbMetacarpal', mixamorigRightHandThumb2: 'rightThumbProximal',
            mixamorigRightHandThumb3: 'rightThumbDistal', mixamorigRightHandIndex1: 'rightIndexProximal',
            mixamorigRightHandIndex2: 'rightIndexIntermediate', mixamorigRightHandIndex3: 'rightIndexDistal',
            mixamorigRightHandMiddle1: 'rightMiddleProximal', mixamorigRightHandMiddle2: 'rightMiddleIntermediate',
            mixamorigRightHandMiddle3: 'rightMiddleDistal', mixamorigRightHandRing1: 'rightRingProximal',
            mixamorigRightHandRing2: 'rightRingIntermediate', mixamorigRightHandRing3: 'rightRingDistal',
            mixamorigRightHandPinky1: 'rightLittleProximal', mixamorigRightHandPinky2: 'rightLittleIntermediate',
            mixamorigRightHandPinky3: 'rightLittleDistal',
            mixamorigLeftUpLeg: 'leftUpperLeg', mixamorigLeftLeg: 'leftLowerLeg',
            mixamorigLeftFoot: 'leftFoot', mixamorigLeftToeBase: 'leftToes',
            mixamorigRightUpLeg: 'rightUpperLeg', mixamorigRightLeg: 'rightLowerLeg',
            mixamorigRightFoot: 'rightFoot', mixamorigRightToeBase: 'rightToes'
        };

        function retargetAnimation(fbxAsset, vrm) {
            const clip = THREE.AnimationClip.findByName(fbxAsset.animations, 'mixamo.com')
                || (fbxAsset.animations && fbxAsset.animations[0]);
            if (!clip) return null;

            const tracks = [];
            const restRotationInverse = new THREE.Quaternion();
            const parentRestWorldRotation = new THREE.Quaternion();
            const _quatA = new THREE.Quaternion();
            const _vec3 = new THREE.Vector3();

            const motionHipsHeight = fbxAsset.getObjectByName('mixamorigHips')?.position.y;
            const vrmHipsY = vrm.humanoid?.getNormalizedBoneNode('hips')?.getWorldPosition(_vec3).y;
            const vrmRootY = vrm.scene.getWorldPosition(_vec3).y;
            if (!vrmHipsY || !motionHipsHeight) return null;
            const vrmHipsHeight = Math.abs(vrmHipsY - vrmRootY);
            const hipsPositionScale = vrmHipsHeight / motionHipsHeight;

            clip.tracks.forEach((track) => {
                const trackSplitted = track.name.split('.');
                const mixamoRigName = trackSplitted[0];
                const vrmBoneName = mixamoVRMRigMap[mixamoRigName];
                const vrmNodeName = vrm.humanoid?.getNormalizedBoneNode(vrmBoneName)?.name;
                const mixamoRigNode = fbxAsset.getObjectByName(mixamoRigName);
                if (vrmNodeName == null) return;

                const propertyName = trackSplitted[1];
                mixamoRigNode?.getWorldQuaternion(restRotationInverse).invert();
                mixamoRigNode?.parent?.getWorldQuaternion(parentRestWorldRotation);

                if (track instanceof THREE.QuaternionKeyframeTrack) {
                    for (let i = 0; i < track.values.length; i += 4) {
                        const flatQuaternion = track.values.slice(i, i + 4);
                        _quatA.fromArray(flatQuaternion);
                        _quatA.premultiply(parentRestWorldRotation).multiply(restRotationInverse);
                        _quatA.toArray(flatQuaternion);
                        flatQuaternion.forEach((v, index) => { track.values[index + i] = v; });
                    }
                    tracks.push(new THREE.QuaternionKeyframeTrack(
                        `${vrmNodeName}.${propertyName}`,
                        track.times,
                        track.values.map((v, i) =>
                            vrm.meta?.metaVersion === '0' && i % 2 === 0 ? -v : v
                        )
                    ));
                } else if (track instanceof THREE.VectorKeyframeTrack) {
                    const value = track.values.map((v, i) =>
                        (vrm.meta?.metaVersion === '0' && i % 3 !== 1 ? -v : v) * hipsPositionScale
                    );
                    tracks.push(new THREE.VectorKeyframeTrack(
                        `${vrmNodeName}.${propertyName}`,
                        track.times,
                        value
                    ));
                }
            });

            return new THREE.AnimationClip('vrmAnimation', clip.duration, tracks);
        }

        // ==================== 动作库管理 ====================
        let libraryConfig = null;
        const loadedClips = {}; // name -> { name, clip, emotion, loop, description, category }
        let stats = { total: 0, loaded: 0, failed: 0 };
        let currentCategory = 'idle';
        let allClipsOrder = []; // 全部动作顺序（用于预览切换/轮播）

        async function loadLibraryConfig() {
            try {
                const res = await fetch('/anim/animation-library.json');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                libraryConfig = await res.json();
                log('配置加载成功', 'success');

                // 统计总数 + 顺序列表
                let total = 0;
                allClipsOrder = [];
                for (const key in libraryConfig.categories) {
                    const cat = libraryConfig.categories[key];
                    total += cat.animations.length;
                    for (const a of cat.animations) {
                        allClipsOrder.push({ ...a, category: key });
                    }
                }
                stats.total = total;
                updateStats();

                // 生成分类标签
                renderCategoryTabs();
                renderEmotionButtons();
                renderClipList();

                return libraryConfig;
            } catch (e) {
                log('配置加载失败: ' + e.message, 'error');
                return null;
            }
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-loaded').textContent = stats.loaded;
            document.getElementById('stat-failed').textContent = stats.failed;
            const pct = stats.total > 0 ? (stats.loaded + stats.failed) / stats.total * 100 : 0;
            document.getElementById('load-progress').style.width = pct + '%';
        }

        function renderCategoryTabs() {
            const tabs = document.getElementById('category-tabs');
            tabs.innerHTML = '';
            for (const key in libraryConfig.categories) {
                const cat = libraryConfig.categories[key];
                const tab = document.createElement('div');
                tab.className = 'cat-tab' + (key === currentCategory ? ' active' : '');
                tab.textContent = `${cat.label} (${cat.animations.length})`;
                tab.onclick = () => {
                    currentCategory = key;
                    document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderClipList();
                };
                tabs.appendChild(tab);
            }
        }

        function renderEmotionButtons() {
            const grid = document.getElementById('emotion-grid');
            grid.innerHTML = '';
            const emotions = libraryConfig.emotionMap ? Object.keys(libraryConfig.emotionMap) : [];
            emotions.forEach(emotion => {
                const btn = document.createElement('button');
                btn.className = 'emotion-btn';
                btn.textContent = emotion;
                btn.onclick = () => playEmotionClip(emotion);
                grid.appendChild(btn);
            });
        }

        function renderClipList() {
            const list = document.getElementById('clip-list');
            if (!libraryConfig) {
                list.innerHTML = '<div class="empty-state">加载配置后显示动作列表</div>';
                return;
            }
            const cat = libraryConfig.categories[currentCategory];
            if (!cat || cat.animations.length === 0) {
                list.innerHTML = '<div class="empty-state">该分类暂无动作</div>';
                return;
            }

            list.innerHTML = '';
            cat.animations.forEach(anim => {
                const item = document.createElement('div');
                item.className = 'clip-item';
                item.id = 'clip-' + anim.name;

                const isLoaded = !!loadedClips[anim.name];
                if (!isLoaded) item.classList.add('loading');

                item.innerHTML = `
                    <div class="clip-info">
                        <span class="clip-name">${anim.name}</span>
                        <span class="clip-meta">
                            ${anim.emotion ? `<span class="clip-emotion">${anim.emotion}</span>` : ''}
                            ${anim.loop ? ' · 循环' : ' · 单次'}
                            ${isLoaded ? ` · ${loadedClips[anim.name].clip.duration.toFixed(1)}s` : ' · 未加载'}
                        </span>
                    </div>
                    <div class="clip-actions">
                        <button class="play-btn" title="${isLoaded ? '预览' : '加载并预览'}">▶</button>
                    </div>
                `;

                // 整行可点击预览（含播放按钮）
                const doPlay = async () => {
                    if (loadedClips[anim.name]) {
                        playClip(anim.name);
                    } else {
                        await loadSingleClip(anim, currentCategory);
                        if (loadedClips[anim.name]) {
                            playClip(anim.name);
                        }
                    }
                };
                item.onclick = (e) => {
                    if (e.target.closest('.play-btn')) return;
                    doPlay();
                };
                item.querySelector('.play-btn').onclick = (e) => {
                    e.stopPropagation();
                    doPlay();
                };

                list.appendChild(item);
            });
        }

        async function loadSingleClip(anim, category) {
            if (!currentVRM) {
                log('请先加载 VRM 模型', 'warn');
                return;
            }
            const url = (libraryConfig.baseUrl || '/anim/') + anim.file;
            log(`加载: ${anim.name}`, 'info');
            try {
                const loader = new FBXLoader();
                const fbxAsset = await loader.loadAsync(url);
                const clip = retargetAnimation(fbxAsset, currentVRM);
                if (!clip) throw new Error('重定向失败');

                loadedClips[anim.name] = {
                    name: anim.name,
                    clip,
                    emotion: anim.emotion,
                    loop: anim.loop ?? false,
                    description: anim.description,
                    category
                };
                stats.loaded++;
                updateStats();
                renderClipList();
                log(`✓ ${anim.name} (${clip.duration.toFixed(2)}s, ${clip.tracks.length}轨道)`, 'success');
            } catch (e) {
                stats.failed++;
                updateStats();
                log(`✗ ${anim.name}: ${e.message}`, 'error');
            }
        }

        async function loadAllClips(lazy = false) {
            if (!currentVRM) {
                log('请先加载 VRM 模型', 'warn');
                return;
            }
            if (!libraryConfig) {
                log('配置未加载', 'error');
                return;
            }

            document.getElementById('load-lib-btn').disabled = true;
            document.getElementById('load-lazy-btn').disabled = true;

            let toLoad = allClipsOrder.filter(a => !loadedClips[a.name]);

            if (lazy) {
                toLoad = allClipsOrder.filter(a => a.category === 'idle' && !loadedClips[a.name]);
                log(`懒加载模式: 优先加载 ${toLoad.length} 个待机动作`, 'info');
            } else {
                log(`开始加载 ${toLoad.length} 个动作...`, 'info');
            }

            for (const anim of toLoad) {
                await loadSingleClip(anim, anim.category);
            }

            log(`加载完成: ${stats.loaded}/${stats.total} 成功, ${stats.failed} 失败`, 'success');

            document.getElementById('stop-btn').disabled = false;

            // 懒加载后台继续
            if (lazy) {
                const remaining = allClipsOrder.filter(a => !loadedClips[a.name]);
                if (remaining.length > 0) {
                    log(`后台继续加载剩余 ${remaining.length} 个动作...`, 'info');
                    backgroundLoad(remaining);
                }
            }
        }

        async function backgroundLoad(anims) {
            for (const anim of anims) {
                await new Promise(r => setTimeout(r, 200));
                if (!loadedClips[anim.name]) {
                    await loadSingleClip(anim, anim.category);
                }
            }
            log('后台加载全部完成', 'success');
        }

        // ==================== 播放与预览控制 ====================
        let currentIdx = -1;
        let autoMode = false;
        let autoTimer = null;
        let paused = false;

        function playClip(name) {
            if (!mixer || !loadedClips[name]) return;

            if (currentAction) {
                currentAction.stop();
                currentAction = null;
            }

            // 移除之前的 playing 标记
            document.querySelectorAll('.clip-item.playing').forEach(el => el.classList.remove('playing'));

            const info = loadedClips[name];
            const action = mixer.clipAction(info.clip);
            action.reset();
            action.setLoop(info.loop ? THREE.LoopRepeat : THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            action.play();
            currentAction = action;
            paused = false;
            updatePlayBtn();

            const item = document.getElementById('clip-' + name);
            if (item) item.classList.add('playing');

            // 更新预览条
            const idx = allClipsOrder.findIndex(a => a.name === name);
            if (idx >= 0) currentIdx = idx;
            document.getElementById('preview-name').textContent = name;

            log(`▶ 播放: ${name} (${info.clip.duration.toFixed(1)}s, ${info.loop ? '循环' : '单次'})`, 'info');

            // 自动轮播：单次动作播完自动下一个；循环动作播 4 秒后下一个
            if (autoMode) scheduleNext(info);
        }

        function scheduleNext(info) {
            clearTimeout(autoTimer);
            const dur = info && !info.loop ? info.clip.duration : 4;
            autoTimer = setTimeout(() => {
                if (autoMode) playByIndex((currentIdx + 1) % allClipsOrder.length);
            }, dur * 1000);
        }

        function playByIndex(idx) {
            if (!allClipsOrder.length) return;
            const anim = allClipsOrder[idx];
            if (!anim) return;
            const doPlay = () => {
                if (loadedClips[anim.name]) {
                    playClip(anim.name);
                } else {
                    loadSingleClip(anim, anim.category).then(() => {
                        if (loadedClips[anim.name]) playClip(anim.name);
                    });
                }
            };
            doPlay();
        }

        function togglePause() {
            if (!currentAction) return;
            paused = !paused;
            if (mixer) mixer.timeScale = paused ? 0 : 1;
            updatePlayBtn();
            log(paused ? '⏸ 已暂停' : '▶ 继续播放', 'info');
        }

        function updatePlayBtn() {
            const btn = document.getElementById('play-btn');
            btn.textContent = paused ? '▶' : '⏸';
        }

        function toggleAuto() {
            autoMode = !autoMode;
            const btn = document.getElementById('auto-btn');
            btn.classList.toggle('active', autoMode);
            btn.textContent = autoMode ? '⏹' : '▶';
            log(autoMode ? '自动轮播已开启' : '自动轮播已关闭', 'info');
            if (autoMode) {
                if (currentIdx < 0 && allClipsOrder.length) {
                    playByIndex(0);
                } else if (currentAction) {
                    scheduleNext(loadedClips[allClipsOrder[currentIdx]?.name]);
                }
            } else {
                clearTimeout(autoTimer);
            }
        }

        function stopClip() {
            if (currentAction) {
                currentAction.stop();
                currentAction = null;
            }
            if (mixer) mixer.timeScale = 1;
            paused = false;
            updatePlayBtn();
            document.querySelectorAll('.clip-item.playing').forEach(el => el.classList.remove('playing'));
            document.getElementById('preview-name').textContent = '—';
            log('⏹ 停止播放', 'info');
        }

        function playEmotionClip(emotion) {
            const pool = libraryConfig.emotionMap?.[emotion];
            if (!pool || pool.length === 0) {
                log(`情绪 ${emotion} 没有关联动作`, 'warn');
                return;
            }
            const available = pool.filter(n => loadedClips[n]);
            if (available.length === 0) {
                log(`情绪 ${emotion} 的动作都还没加载，先加载第一个...`, 'warn');
                const catKey = Object.keys(libraryConfig.categories).find(k =>
                    libraryConfig.categories[k].animations.some(a => a.name === pool[0])
                );
                if (catKey) {
                    const anim = libraryConfig.categories[catKey].animations.find(a => a.name === pool[0]);
                    if (anim) {
                        loadSingleClip(anim, catKey).then(() => {
                            if (loadedClips[anim.name]) playClip(anim.name);
                        });
                    }
                }
                return;
            }
            const name = available[Math.floor(Math.random() * available.length)];
            playClip(name);
        }

        // ==================== 模型列表 ====================
        async function loadModelList() {
            try {
                const res = await fetch('/api/models');
                const data = await res.json();
                const models = data.models || [];
                const select = document.getElementById('model-select');
                select.innerHTML = '';
                if (models.length === 0) {
                    select.innerHTML = '<option value="">无可用模型</option>';
                    return;
                }
                models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.url;
                    opt.textContent = m.name || m.url.split('/').pop();
                    select.appendChild(opt);
                });
                document.getElementById('load-model-btn').disabled = false;
                log(`找到 ${models.length} 个模型`, 'success');
            } catch (e) {
                log('获取模型列表失败: ' + e.message, 'error');
                document.getElementById('model-select').innerHTML = '<option value="">加载失败</option>';
            }
        }

        // ==================== 事件绑定 ====================
        document.getElementById('load-model-btn').onclick = () => {
            const url = document.getElementById('model-select').value;
            if (url) loadVRM(url);
        };

        document.getElementById('load-lib-btn').onclick = () => loadAllClips(false);
        document.getElementById('load-lazy-btn').onclick = () => loadAllClips(true);
        document.getElementById('stop-btn').onclick = stopClip;

        // 预览控制条
        document.getElementById('prev-btn').onclick = () => {
            if (!allClipsOrder.length) return;
            playByIndex((currentIdx - 1 + allClipsOrder.length) % allClipsOrder.length);
        };
        document.getElementById('next-btn').onclick = () => {
            if (!allClipsOrder.length) return;
            playByIndex((currentIdx + 1) % allClipsOrder.length);
        };
        document.getElementById('play-btn').onclick = togglePause;
        document.getElementById('auto-btn').onclick = toggleAuto;

        // 键盘快捷键（桌面端）
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'ArrowLeft') document.getElementById('prev-btn').click();
            else if (e.code === 'ArrowRight') document.getElementById('next-btn').click();
            else if (e.code === 'Space') { e.preventDefault(); document.getElementById('play-btn').click(); }
            else if (e.key === 'a' || e.key === 'A') document.getElementById('auto-btn').click();
        });

        // ==================== 渲染循环 ====================
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            controls.update();
            if (mixer) mixer.update(dt);
            if (currentVRM) {
                currentVRM.update?.(dt);
            }
            renderer.render(scene, camera);
        }
        animate();

        // ==================== 初始化 ====================
        setStatus('等待加载模型');
        log('预览页初始化完成', 'info');
        loadModelList();
        loadLibraryConfig();
    </script>
</body>
</html>
