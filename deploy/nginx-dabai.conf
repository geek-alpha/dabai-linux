# dabai nginx 前置 TLS 终结配置（待部署）
# 安装 nginx 后：sudo cp deploy/nginx-dabai.conf /etc/nginx/sites-available/dabai
#               sudo ln -sf /etc/nginx/sites-available/dabai /etc/nginx/sites-enabled/
#               sudo nginx -t && sudo systemctl reload nginx
# 启动 dabai 时带环境变量：DABAI_HTTP_ONLY=1（回源走 HTTP，uvloop 跑纯 HTTP）

server {
    listen 8000 ssl;
    server_name _;

    # 复用 dabai 自签名证书
    ssl_certificate     /home/wxf/dabai/cert.pem;
    ssl_certificate_key /home/wxf/dabai/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # WebSocket 升级（VR/陀螺仪/流式对话全靠它）
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
