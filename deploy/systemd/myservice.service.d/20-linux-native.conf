# 大白 Linux 原生集成 —— 对现有 myservice.service 的**最小增量**（不改原 unit 文件）
#
# 为什么用 drop-in 而不是新建 unit：
#   大白已经由系统级 /etc/systemd/system/myservice.service 托管（User=wxf，已 enabled）。
#   再建一个用户级 unit 会**抢同一个 8000/8001 端口**，造成双实例互踢。
#   drop-in 只叠加差异，原文件不动，撤销 = 删一个文件。
#
# 应用：
#   sudo install -Dm644 deploy/systemd/myservice.service.d/20-linux-native.conf \
#        /etc/systemd/system/myservice.service.d/20-linux-native.conf
#   sudo systemctl daemon-reload && sudo systemctl restart myservice
#
# 撤销：
#   sudo rm /etc/systemd/system/myservice.service.d/20-linux-native.conf
#   sudo systemctl daemon-reload && sudo systemctl restart myservice
#
# 验证：
#   systemd-analyze verify /etc/systemd/system/myservice.service
#   systemctl show myservice.service -p SyslogIdentifier,CPUWeight,NoNewPrivileges,UMask

[Unit]
# ⚠ 这里**刻意没有** After= / Wants=sing-box.service
#
# 踩坑记录：sing-box 装的是**用户级** unit（~/.config/systemd/user/sing-box.service），
# 而本 unit 是**系统级**。systemd 不支持跨 scope 依赖 ——
#   · After=sing-box.service   → 静默忽略（指向不存在的系统 unit）
#   · Wants=sing-box.service   → daemon-reload 报 "Unit not found"，依赖永不生效
# 两种写法都是死代码，写了等于没写。
#
# 正确应对是**运行时降级**：大白启动时探测 127.0.0.1:7890，不通就直连
# （搜索技能已内置此逻辑），而不是靠启动顺序保证。
# 若将来要让依赖真正生效，需把 sing-box 提升为系统级 unit（另需 sudo，未做）。

[Service]
# 日志标识：原配置没设，日志 tag 是 "python"，混在系统日志里分不清是大白还是别的 python 进程
SyslogIdentifier=dabai

# PATH：systemd 系统服务的默认 PATH 不含 ~/.local/bin，
# 而 sb-proxy / sb-node（代理控制脚本）就装在那里
Environment=PATH=/home/wxf/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# 与 sing-box 争 CPU 时大白优先：对话延迟敏感，代理延迟不敏感
CPUWeight=200
IOWeight=200

# 线程上限：默认 806 偏松，收紧到 512（实测当前 30，留 17 倍余量）
TasksMax=512

# 子进程被 OOM 杀掉时不连坐整个服务（原配置 OOMPolicy=stop 会连带停服）
OOMPolicy=continue

# ---- 加固段：已于 2026-09-12 按用户明确要求全部移除 ----
#
# 为什么必须移除 NoNewPrivileges：
#   该标志让内核拒绝一切 setuid 提权 —— 连 sudo 本身都跑不起来，
#   报错：The "no new privileges" flag is set, which prevents sudo from running as root.
#   后果是「免密特权副本」/usr/local/sbin/dabai-linux-native 与全部系统级操作
#   （改 target / 管 lightdm / 装服务）被彻底锁死，形同虚设。
#
# 现状：不做任何安全加固。大白拥有与 wxf 普通用户完全一致的能力，含 sudo。
# 其余功能性配置（SyslogIdentifier / PATH / CPUWeight / OOMPolicy / TasksMax /
# EnvironmentFile）全部保留，未受影响。
#
# 回滚：把下面 13 行取消注释，然后
#   sudo systemctl daemon-reload && sudo systemctl restart myservice
# NoNewPrivileges=yes
# ProtectKernelTunables=yes
# ProtectKernelModules=yes
# ProtectControlGroups=yes
# ProtectClock=yes
# ProtectHostname=yes
# RestrictRealtime=yes
# RestrictSUIDSGID=yes
# LockPersonality=yes
# RestrictNamespaces=yes
# SystemCallArchitectures=native
# RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
# UMask=0077
