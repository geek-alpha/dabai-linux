# 大白 Linux 原生集成 —— 对现有 myservice.service 的**最小增量**（不改原 unit 文件）
#
# 为什么用 drop-in 而不是新建 unit：
#   大白已经由系统级 /etc/systemd/system/myservice.service 托管（User=wxf，已 enabled）。
#   再建一个用户级 unit 会**抢同一个 8000/8001 端口**，造成双实例互踢。
#   drop-in 只叠加差异，原文件不动，撤销 = 删一个文件。
#
# 应用：
#   sudo install -Dm644 deploy/systemd/myservice.service.d/20-linux-native.conf \
#        /etc/systemd/system/myservice.service.d/20-linux-native.conf
#   sudo systemctl daemon-reload && sudo systemctl restart myservice
#
# 撤销：
#   sudo rm /etc/systemd/system/myservice.service.d/20-linux-native.conf
#   sudo systemctl daemon-reload && sudo systemctl restart myservice
#
# 验证：
#   systemd-analyze verify /etc/systemd/system/myservice.service
#   systemctl show myservice.service -p SyslogIdentifier,CPUWeight,NoNewPrivileges,UMask

[Unit]
# 代理是搜索技能的依赖：让 sing-box 先就绪。
# 用 Wants 而非 Requires —— 代理挂了也允许大白启动（搜索降级直连，不影响对话）
After=sing-box.service
Wants=sing-box.service

[Service]
# 日志标识：原配置没设，日志 tag 是 "python"，混在系统日志里分不清是大白还是别的 python 进程
SyslogIdentifier=dabai

# PATH：systemd 系统服务的默认 PATH 不含 ~/.local/bin，
# 而 sb-proxy / sb-node（代理控制脚本）就装在那里
Environment=PATH=/home/wxf/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# 与 sing-box 争 CPU 时大白优先：对话延迟敏感，代理延迟不敏感
CPUWeight=200
IOWeight=200

# 线程上限：默认 806 偏松，收紧到 512（实测当前 30，留 17 倍余量）
TasksMax=512

# 子进程被 OOM 杀掉时不连坐整个服务（原配置 OOMPolicy=stop 会连带停服）
OOMPolicy=continue

# ---- 安全加固（保守子集，经 systemd-analyze security 核过）----
# 大白是通用智能体：要读写任意工作区路径、执行任意命令、spawn 子智能体。
# 所以**刻意不加** ProtectSystem / ProtectHome / PrivateTmp / SystemCallFilter ——
# 那几项会把它的核心能力直接锁死。只加固确定不影响功能的部分：
NoNewPrivileges=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictNamespaces=yes
SystemCallArchitectures=native
# 必须含 AF_NETLINK —— system_check 的 `ss -ltnp` 靠它枚举端口，漏了会静默失败
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK

# 新建文件默认仅属主可读（进程内存里有对话内容与 API 凭据）
UMask=0077
